<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant blue-navy gradient to ensure the background squircle stands out clearly on dark browser tabs -->
    <linearGradient id="bg-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="50%" stop-color="#1E3A5F" />
      <stop offset="100%" stop-color="#2B558C" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with strong visibility -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)" />

  <!-- Highly visible, bright geometric diamond with sharp dark outlines separating clean white/pastel facets -->
  <g stroke="#0E1E38" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <!-- Top Table Facet -->
    <polygon points="208,170 304,170 288,228 224,228" fill="#FFFFFF" />
    
    <!-- Left Crown Facet -->
    <polygon points="160,170 208,170 224,228 112,246" fill="#E0F2FE" />
    
    <!-- Right Crown Facet -->
    <polygon points="304,170 352,170 400,246 288,228" fill="#D1FAE5" />
    
    <!-- Left Pavilion Facet -->
    <polygon points="112,246 224,228 256,382" fill="#BAE6FD" />
    
    <!-- Center Pavilion Facet -->
    <polygon points="224,228 288,228 256,382" fill="#E0F2FE" />
    
    <!-- Right Pavilion Facet -->
    <polygon points="288,228 400,246 256,382" fill="#A7F3D0" />
  </g>
</svg>
